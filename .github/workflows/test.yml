name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff
        run: uv run ruff check custom_components tests

      - name: Run pytest
        run: uv run pytest tests/ -v

      # 22.12+ loads the strategy's plain .js file as an ES module without a package.json.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Run dashboard strategy tests
        run: node --test "tests/js/*.test.mjs"

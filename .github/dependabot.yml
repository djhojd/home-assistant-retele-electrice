# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Majors stay as separate PRs so one breaking action can't block the rest.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # "uv" (not "pip") so uv.lock is updated too. homeassistant is deliberately
  # not ignored: bumping it tests against new HA releases and unblocks the
  # security fixes for the packages it pins. hacs.json still sets the user minimum.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to lru-dict>=1.4.1 override in pyproject.toml; see the comment there.
      - dependency-name: "lru-dict"
